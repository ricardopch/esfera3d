plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.ricardopch.esfera3d'
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.ricardopch.esfera3d'
        minSdk = 26
        targetSdk = 36
        versionCode = 4
        versionName = '1.3'
    }

    // Firma fija incluida en el proyecto: cada APK nuevo se instala encima del anterior.
    signingConfigs {
        debug {
            storeFile = file('debug.keystore')
            storeType = 'pkcs12'
            storePassword = 'android'
            keyAlias = 'androiddebugkey'
            keyPassword = 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig = signingConfigs.debug
        }
        release {
            minifyEnabled = false
            signingConfig = signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    lint {
        // La interoperabilidad con Camera2 de CameraX está marcada como "experimental".
        abortOnError = false
        checkReleaseBuilds = false
    }
}

dependencies {
    def camerax = '1.4.2'
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.core:core:1.13.1'
    implementation 'com.google.guava:listenablefuture:1.0'
}
